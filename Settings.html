<body>

  <div class="header">
    <h1>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.43 12.98c.04-.32.07-.64.07-.98 0-.34-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65A.488.488 0 0014 2h-4c-.25 0-.46.18-.5.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98 0 .33.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
      </svg>
      <span data-i18n="headerTitle">Carnet Alimentaire</span>
    </h1>
    <p data-i18n="headerSettingsSubtitle">Intelligence Artificielle</p>
  </div>

  <div class="container">
    <div class="info-box">
      <span data-i18n="infoApiKey">L'analyse diététique de votre carnet est propulsée par l'intelligence artificielle Gemini de Google. Pour l'activer, vous devez fournir une clé API (gratuite) :</span><br><br>
      <a href="https://aistudio.google.com/app/apikey" target="_blank" data-i18n="linkApiKey">Google AI Studio</a>
    </div>

    <div class="card">
      <div class="form-group">
        <label for="apiKey" class="label" data-i18n="lblApiKey">Clé API Gemini</label>
        <input type="password" id="apiKey" class="input" placeholder="AIzaSy...">
      </div>

      <button type="button" class="btn btn-primary" id="btnSubmit" onclick="saveSettings()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        <span data-i18n="btnSaveSettings">Enregistrer la clé</span>
      </button>
    </div>
  </div>

  <div id="loadingOverlay">
    <div class="overlay-spinner"></div>
  </div>

  <script>
    const SERVER_LOCALE = "<?= locale ?>";
  </script>
  <?!= include('JavaScript') ?>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      showOverlay();
      google.script.run
        .withSuccessHandler(function(key) {
          hideOverlay();
          if (key) {
            document.getElementById('apiKey').value = key;
          }
        })
        .withFailureHandler(function(err) {
          hideOverlay();
        })
        .getApiKey();
    });

    function saveSettings() {
      showOverlay();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;

      const key = document.getElementById('apiKey').value.trim();

      google.script.run
        .withSuccessHandler(function(success) {
          hideOverlay();
          btn.disabled = false;
          if (success) {
            showToast(getTxt('msgSuccess'), 'success');
            setTimeout(function() {
              google.script.host.close();
            }, 1500);
          } else {
            showToast(getTxt('msgError'), 'error');
          }
        })
        .withFailureHandler(function(error) {
          hideOverlay();
          btn.disabled = false;
          showToast(getTxt('msgError') + " : " + error, 'error');
        })
        .saveApiKey(key);
    }
  </script>
</body>
</html>
