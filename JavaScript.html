  // Raccourci pour obtenir une traduction
  function getTxt(key) {
    return TRANSLATIONS[USER_LOCALE][key] || TRANSLATIONS['en'][key] || key;
  }

  // 3. Application dynamique des traductions basées sur les attributs data-i18n
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (el.tagName === 'INPUT' && el.type === 'button') {
        el.value = getTxt(key);
      } else if (el.tagName === 'INPUT' && el.type === 'text') {
        el.placeholder = getTxt(key);
      } else {
        el.textContent = getTxt(key);
      }
    });
  });

  // Utilitaires de Toast et d'Overlay
  function showOverlay() {
    const overlay = document.getElementById("loadingOverlay");
    if (overlay) overlay.classList.add("show");
  }

  function hideOverlay() {
    const overlay = document.getElementById("loadingOverlay");
    if (overlay) overlay.classList.remove("show");
  }

  function showToast(message, type = 'success') {
    let toast = document.getElementById('toastNotification');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'toastNotification';
      document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.className = `toast show ${type}`;
    
    setTimeout(() => {
      toast.classList.remove('show');
    }, 3000);
  }
</script>
