<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <!-- Import des styles globaux et des polices Google Workspace -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <?!= include('Stylesheet') ?>
</head>
<body>

  <!-- En-tête Sidebar -->
  <div class="header">
    <h1>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.51c-.32-.78-.9-1.42-1.61-1.84V15c0-1.1-.9-2-2-2h-1v-2h-2V9c0-1.1-.9-2-2-2h-1V5.08c3.39.49 6.13 2.92 7.15 6.12.39 1.18.6 2.45.6 3.8 0 1.63-.44 3.16-1.15 4.42z"/>
      </svg>
      <span data-i18n="headerTitle">Carnet Alimentaire</span>
    </h1>
    <p data-i18n="headerSubtitle">Suivez vos repas quotidiens</p>
  </div>

  <div class="container">
    <div class="card">
      <div class="card-title" data-i18n="cardSaisieTitle">Nouveau repas</div>
      
      <form id="foodForm">
        <div class="form-group">
          <label for="date" class="label" data-i18n="lblDate">Date</label>
          <input type="date" id="date" name="date" class="input" required>
        </div>

        <div class="form-group">
          <label for="periode" class="label" data-i18n="lblPeriode">Période</label>
          <select id="periode" name="periode" class="select">
            <option value="Petit déjeuner" data-i18n="optPetitDej">Petit déjeuner</option>
            <option value="Matinée" data-i18n="optMatinee">Matinée</option>
            <option value="Déjeuner" data-i18n="optDejeuner" selected>Déjeuner</option>
            <option value="Après-midi" data-i18n="optApresMidi">Après-midi</option>
            <option value="Dîner" data-i18n="optDiner">Dîner</option>
            <option value="Soirée" data-i18n="optSoiree">Soirée</option>
            <option value="Nuit" data-i18n="optNuit">Nuit</option>
            <option value="Autres prises alimentaires" data-i18n="optAutres">Autres prises alimentaires</option>
          </select>
        </div>

        <div class="form-group">
          <label for="heure" class="label" data-i18n="lblHeure">Heure</label>
          <input type="time" id="heure" name="heure" class="input">
        </div>

        <div class="form-group">
          <label for="menu" class="label" data-i18n="lblMenu">Menu précis</label>
          <input type="text" id="menu" name="menu" class="input" list="menu-suggestions" required>
          <datalist id="menu-suggestions"></datalist>
        </div>

        <div class="form-group">
          <label class="label" data-i18n="lblQte">Quantités</label>
          <div style="display: flex; gap: 10px;">
            <input type="number" step="any" id="quantiteValeur" class="input" data-i18n="placeholderQte" style="flex: 1;">
            <select id="quantiteUnite" class="select" style="flex: 1;">
              <option value="" data-i18n="optNoUnit">(Aucune unité)</option>
              <option value="g" data-i18n="optG">g (grammes)</option>
              <option value="kg">kg</option>
              <option value="ml">ml</option>
              <option value="cl">cl</option>
              <option value="L">L</option>
              <option value="c.à.c">c.à.c</option>
              <option value="c.à.s">c.à.s</option>
              <option value="tasse">tasse</option>
              <option value="bol">bol</option>
              <option value="verre">verre</option>
              <option value="part">part</option>
              <option value="portion">portion</option>
              <option value="tranche">tranche</option>
              <option value="pièce">pièce</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="label" data-i18n="lblCuisson">Cuisson / Assaisonnement</label>
          <div style="display: flex; gap: 10px;">
            <select id="cuissonList" class="select" style="flex: 1;">
              <option value="" data-i18n="optCuissonEmpty">(Cuisson...)</option>
              <option value="Cru" data-i18n="optCru">Cru</option>
              <option value="Vapeur" data-i18n="optVapeur">Vapeur</option>
              <option value="Bouilli / à l'eau" data-i18n="optBouilli">Bouilli / à l'eau</option>
              <option value="Poêlé" data-i18n="optPoele">Poêlé</option>
              <option value="Grillé" data-i18n="optGrille">Grillé</option>
              <option value="Rôti / au four" data-i18n="optRoti">Rôti / au four</option>
              <option value="Frit" data-i18n="optFrit">Frit</option>
              <option value="Mijoté" data-i18n="optMijote">Mijoté</option>
              <option value="Micro-ondes" data-i18n="optMicro">Micro-ondes</option>
            </select>
            <select id="assaisonnementList" class="select" style="flex: 1;">
              <option value="" data-i18n="optAssaisonEmpty">(Assaisonnement...)</option>
              <option value="Sans matière grasse" data-i18n="optSansMat">Sans matière grasse</option>
              <option value="Huile d'olive" data-i18n="optHuileOlive">Huile d'olive</option>
              <option value="Autre huile" data-i18n="optAutreHuile">Autre huile</option>
              <option value="Beurre" data-i18n="optBeurre">Beurre</option>
              <option value="Crème fraîche" data-i18n="optCreme">Crème fraîche</option>
              <option value="Sauce tomate" data-i18n="optSauceTomate">Sauce tomate</option>
              <option value="Vinaigrette" data-i18n="optVinaigrette">Vinaigrette</option>
              <option value="Mayonnaise" data-i18n="optMayo">Mayonnaise</option>
              <option value="Épices / herbes" data-i18n="optEpices">Épices / herbes</option>
            </select>
          </div>
        </div>

        <button type="button" class="btn btn-primary" id="btnSubmit" onclick="saveData()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
          <span data-i18n="btnSaveMeal">Enregistrer le repas</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Pied de page officiel FF Labs -->
  <div class="footer">
    <div class="footer-logo">
      <span>⚡ FF Labs</span>
    </div>
    <div>
      <a href="https://faucheux.bzh" target="_blank">&lt;&gt; par Fabrice Faucheux</a>
    </div>
    <div class="footer-links">
      <a href="https://github.com/FabriceFx/carnet-alimentaire" target="_blank" data-i18n="footerHelp">Aide</a>
    </div>
  </div>

  <!-- Overlay de chargement -->
  <div id="loadingOverlay">
    <div class="overlay-spinner"></div>
  </div>

  <script>
    const SERVER_LOCALE = "<?= locale ?>";
  </script>
  <?!= include('JavaScript') ?>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Mettre la date du jour par défaut
      document.getElementById('date').valueAsDate = new Date();
      
      // Charger les suggestions
      google.script.run
        .withSuccessHandler(function(menus) {
          const datalist = document.getElementById('menu-suggestions');
          menus.forEach(function(menu) {
            const option = document.createElement('option');
            option.value = menu;
            datalist.appendChild(option);
          });
        })
        .getFrequentMenus();
    });

    function saveData() {
      const form = document.getElementById('foodForm');
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      showOverlay();
      const btn = document.getElementById('btnSubmit');
      const originalText = btn.innerHTML;
      btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg> <span>${getTxt('btnSaving')}</span>`;
      btn.disabled = true;

      const qteVal = document.getElementById('quantiteValeur').value;
      const qteUnite = document.getElementById('quantiteUnite').value;
      const quantitesCombine = qteVal ? (qteVal + " " + qteUnite).trim() : "";

      const cVal = document.getElementById('cuissonList').value;
      const aVal = document.getElementById('assaisonnementList').value;
      let cuissonArr = [];
      if (cVal) cuissonArr.push(cVal);
      if (aVal) cuissonArr.push(aVal);
      const cuissonCombine = cuissonArr.join(' / ');

      const formData = {
        date: form.date.value,
        categorie: form.periode.value,
        heureLieu: form.heure.value,
        menu: form.menu.value,
        quantites: quantitesCombine,
        cuisson: cuissonCombine
      };

      google.script.run
        .withSuccessHandler(() => {
          hideOverlay();
          btn.innerHTML = originalText;
          btn.disabled = false;
          showToast(getTxt('msgSuccess'), 'success');
          
          // Reset fields but keep date, periode and time
          form.menu.value = '';
          document.getElementById('quantiteValeur').value = '';
          document.getElementById('quantiteUnite').value = '';
          document.getElementById('cuissonList').value = '';
          document.getElementById('assaisonnementList').value = '';
        })
        .withFailureHandler((error) => {
          hideOverlay();
          btn.innerHTML = originalText;
          btn.disabled = false;
          showToast(getTxt('msgError') + ' : ' + error.message, 'error');
          google.script.run.logEvent("Erreur d'appel client : " + error.message, "ERROR");
        })
        .saveMealData(formData);
    }
  </script>
</body>
</html>
