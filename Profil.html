<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <?!= include('Stylesheet') ?>
</head>
<body>

  <div class="header">
    <h1>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
      <span data-i18n="headerTitle">Carnet Alimentaire</span>
    </h1>
    <p data-i18n="headerProfilSubtitle">Informations personnelles</p>
  </div>

  <div class="container">
    <div class="card">
      <div class="card-title" data-i18n="cardProfilTitle">Données de base</div>
      
      <form id="profilForm">
        <div class="form-group">
          <label for="nom" class="label" data-i18n="lblNom">Nom</label>
          <input type="text" id="nom" name="nom" class="input">
        </div>

        <div class="form-group">
          <label for="prenom" class="label" data-i18n="lblPrenom">Prénom</label>
          <input type="text" id="prenom" name="prenom" class="input">
        </div>

        <div class="form-group">
          <label for="dateNaissance" class="label" data-i18n="lblDateNaiss">Date de naissance</label>
          <input type="date" id="dateNaissance" name="dateNaissance" class="input">
        </div>

        <div class="form-group">
          <label for="sexe" class="label" data-i18n="lblSexe">Sexe</label>
          <select id="sexe" name="sexe" class="select">
            <option value="Femme" data-i18n="optFemme">Femme</option>
            <option value="Homme" data-i18n="optHomme">Homme</option>
            <option value="Autre" data-i18n="optAutre">Autre</option>
          </select>
        </div>

        <div class="form-group">
          <label for="poids" class="label" data-i18n="lblPoids">Poids de départ (kg)</label>
          <input type="number" id="poids" name="poids" step="0.1" class="input">
        </div>

        <button type="button" class="btn btn-primary" id="btnSubmit" onclick="saveProfile()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/>
          </svg>
          <span data-i18n="btnSaveProfile">Mettre à jour le profil</span>
        </button>
      </form>
    </div>
  </div>

  <div id="loadingOverlay">
    <div class="overlay-spinner"></div>
  </div>

  <script>
    const SERVER_LOCALE = "<?= locale ?>";
  </script>
  <?!= include('JavaScript') ?>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      showOverlay();
      google.script.run
        .withSuccessHandler(function(data) {
          hideOverlay();
          if (data) {
            document.getElementById('nom').value = data.nom || '';
            document.getElementById('prenom').value = data.prenom || '';
            document.getElementById('dateNaissance').value = data.dateNaissance || '';
            document.getElementById('sexe').value = data.sexe || 'Femme';
            document.getElementById('poids').value = data.poids || '';
          }
        })
        .withFailureHandler((error) => {
          hideOverlay();
          showToast(error.message, 'error');
        })
        .getProfileData();
    });

    function saveProfile() {
      showOverlay();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;

      const profileData = {
        nom: document.getElementById('nom').value,
        prenom: document.getElementById('prenom').value,
        dateNaissance: document.getElementById('dateNaissance').value,
        sexe: document.getElementById('sexe').value,
        poids: document.getElementById('poids').value
      };

      google.script.run
        .withSuccessHandler(function() {
          hideOverlay();
          btn.disabled = false;
          showToast(getTxt('msgSuccess'), 'success');
          setTimeout(() => google.script.host.close(), 1500);
        })
        .withFailureHandler(function(error) {
          hideOverlay();
          btn.disabled = false;
          showToast(getTxt('msgError') + ' : ' + error.message, 'error');
        })
        .saveProfileData(profileData);
    }
  </script>
</body>
</html>
