<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            padding: 15px;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        #status {
            margin-top: 15px;
            padding: 10px;
            display: none;
            text-align: center;
            border-radius: 4px;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>
    <div>
        <div class="block form-group">
            <label for="nom">Nom</label>
            <input type="text" id="nom" style="width: 100%;">
        </div>

        <div class="block form-group">
            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" style="width: 100%;">
        </div>

        <div class="block form-group">
            <label for="dateNaissance">Date de naissance</label>
            <input type="date" id="dateNaissance" style="width: 100%;">
        </div>

        <div class="block form-group">
            <label for="sexe">Sexe</label>
            <select id="sexe" style="width: 100%;">
                <option value="Non précisé">Non précisé</option>
                <option value="Masculin">Masculin</option>
                <option value="Féminin">Féminin</option>
                <option value="Autre">Autre</option>
            </select>
        </div>

        <div class="block form-group">
            <label for="poids">Poids de départ (kg)</label>
            <input type="number" step="0.1" id="poids" placeholder="ex: 70.5" style="width: 100%;">
        </div>

        <div class="buttons">
            <button class="action" onclick="saveProfile()" style="flex: 1;">Enregistrer</button>
            <button onclick="google.script.host.close()" style="flex: 1;">Fermer</button>
        </div>

        <div id="status"></div>
    </div>

    <script>
        // Charger les données existantes à l'ouverture
        document.addEventListener("DOMContentLoaded", function() {
            google.script.run
                .withSuccessHandler(function(data) {
                    if (data) {
                        document.getElementById('nom').value = data.nom || '';
                        document.getElementById('prenom').value = data.prenom || '';
                        document.getElementById('dateNaissance').value = data.dateNaissance || '';
                        document.getElementById('sexe').value = data.sexe || 'Non précisé';
                        document.getElementById('poids').value = data.poids || '';
                    }
                })
                .withFailureHandler(function(error) {
                    showStatus("Erreur lors du chargement : " + error, "error");
                })
                .getProfileData();
        });

        function saveProfile() {
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'none';

            const profileData = {
                nom: document.getElementById('nom').value,
                prenom: document.getElementById('prenom').value,
                dateNaissance: document.getElementById('dateNaissance').value,
                sexe: document.getElementById('sexe').value,
                poids: document.getElementById('poids').value
            };

            google.script.run
                .withSuccessHandler(function(response) {
                    if (response.success) {
                        showStatus(response.message, "success");
                        setTimeout(() => google.script.host.close(), 1500);
                    } else {
                        showStatus(response.message, "error");
                    }
                })
                .withFailureHandler(function(error) {
                    showStatus("Erreur : " + error, "error");
                })
                .saveProfileData(profileData);
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = message;
            statusDiv.className = type;
            statusDiv.style.display = 'block';
        }
    </script>
</body>

</html>
